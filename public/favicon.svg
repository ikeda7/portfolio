<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Waveform">
  <!-- Fundo proprio: o icone funciona tanto em aba clara quanto escura. -->
  <rect width="32" height="32" rx="7" fill="#0D0D0D"/>
  <rect x="2.5" y="2.5" width="27" height="27" rx="5.5" fill="none" stroke="#262626"/>
  <g fill="#BB4DFF">
    <!-- Tres barras de alturas diferentes: le como waveform ja a 16px. -->
    <rect x="7"  y="12" width="4" height="8"  rx="2"/>
    <rect x="14" y="7"  width="4" height="18" rx="2"/>
    <rect x="21" y="10" width="4" height="12" rx="2"/>
  </g>
</svg>
