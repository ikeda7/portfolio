name: CI

# Os mesmos quatro portoes que o CLAUDE.md manda rodar antes de commitar.
# Ate agora eles dependiam de alguem lembrar; aqui passam a rodar sozinhos em
# todo PR e em todo push para develop e main.
on:
  pull_request:
  push:
    branches: [develop, main]

# Push novo na mesma branch cancela a execucao anterior: o resultado do commit
# antigo nao interessa mais e so ocuparia a fila.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portoes:
    name: typecheck · lint · format · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` e nao `npm install`: instala exatamente o que esta no
      # package-lock e falha se ele estiver fora de sincronia com o
      # package.json, em vez de corrigir em silencio.
      - run: npm ci

      # Sem `continue-on-error`: o primeiro portao que falhar derruba o job.
      # Mas cada um tem nome proprio, entao a aba de checks diz qual foi sem
      # precisar abrir o log.
      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: format
        run: npm run format:check

      # O build fica por ultimo por ser o mais lento: os tres anteriores pegam
      # a maioria dos erros em segundos.
      - name: build
        run: npm run build
